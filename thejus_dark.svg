<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" role="img" aria-labelledby="title desc">
  <title id="title">Thejus P K — AI and ML Engineer</title>
  <desc id="desc">An animated editorial profile banner for Thejus P K.</desc>
  <defs>
    <style>
      .bg { fill: #f6f3ed; }
      .grid { stroke: #d8d2c7; stroke-width: 1; }
      .ink { fill: #111111; }
      .muted { fill: #57534e; }
      .accent { fill: #ff4d34; }
      .mono { font-family: 'Courier New', monospace; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="530"/>
  <rect x="42" y="35" width="1096" height="460" fill="none" class="grid"/>
  <line x1="365" y1="35" x2="365" y2="495" class="grid"/>
  <line x1="775" y1="35" x2="775" y2="495" class="grid"/>
  <line x1="42" y1="116" x2="1138" y2="116" class="grid"/>
  <line x1="42" y1="350" x2="1138" y2="350" class="grid"/>
  <rect x="42" y="35" width="88" height="5" class="accent">
    <animate attributeName="width" values="88;160;88" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="42" y="70" class="mono ink" font-size="13" letter-spacing="1.6">THEJUS P K / AI · ML · SYSTEMS</text>
  <text x="1034" y="70" class="mono muted" font-size="11">PROFILE / 2026</text>
  <text x="42" y="185" class="serif ink" font-size="74" font-weight="700">THEJUS</text>
  <text x="42" y="260" class="serif ink" font-size="74" font-weight="700">P K<tspan class="accent">.</tspan></text>
  <text x="404" y="182" class="sans ink" font-size="15" font-weight="700">I BUILD PRACTICAL AI</text>
  <text x="404" y="222" class="serif ink" font-size="29">that turns complex ideas</text>
  <text x="404" y="255" class="serif ink" font-size="29">into useful systems.</text>
  <text x="404" y="295" class="sans muted" font-size="12" letter-spacing=".4">DOCUMENT AI / COMPUTER VISION / LLM APPLICATIONS</text>
  <text x="404" y="316" class="sans muted" font-size="12" letter-spacing=".4">MACHINE LEARNING / AUTOMATION / SOFTWARE ENGINEERING</text>
  <text x="404" y="410" class="mono muted" font-size="12">01</text><text x="454" y="410" class="mono ink" font-size="12" font-weight="700">BUILD</text>
  <text x="540" y="410" class="mono muted" font-size="12">02</text><text x="590" y="410" class="mono ink" font-size="12" font-weight="700">MEASURE</text>
  <text x="704" y="410" class="mono muted" font-size="12">03</text><text x="754" y="410" class="mono ink" font-size="12" font-weight="700">SHIP</text>
  <g transform="translate(956 236)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
      <rect x="-82" y="-82" width="164" height="164" fill="none" stroke="#111111" stroke-width="2" transform="rotate(45)"/>
      <circle r="35" class="accent">
        <animate attributeName="r" values="35;42;35" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.72;1" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="22" cy="-18" r="7" fill="#f6f3ed"/>
    </g>
  </g>
  <circle cx="844" cy="145" r="3" class="muted"><animate attributeName="opacity" values=".15;1;.15" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="1092" cy="128" r="3" class="muted"><animate attributeName="opacity" values="1;.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
  <text x="42" y="448" class="serif ink" font-size="19">Practical AI. Curious engineering. Real projects.</text>
  <text x="42" y="474" class="sans muted" font-size="13">An AI / ML engineer building systems people can actually use.</text>
  <text x="1050" y="474" class="mono accent" font-size="11">SCROLL ↓</text>
  <rect x="1025" y="486" width="88" height="4" class="accent">
    <animate attributeName="x" values="988;1025;988" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
