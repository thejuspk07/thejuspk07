<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560">
  <!-- THEJUS PK — minimal editorial AI banner -->
  <rect width="1800" height="560" fill="#F4F1EA"/>

  <!-- quiet editorial grid -->
  <g stroke="#D8D4CB" stroke-width="1" opacity="0.72">
    <path d="M48 48H1752M48 512H1752"/>
    <path d="M48 48V512M1752 48V512"/>
    <path d="M430 48V512M1215 48V512"/>
    <path d="M48 176H1752M48 392H1752"/>
  </g>

  <!-- small animated accent bars -->
  <rect x="48" y="48" width="118" height="5" rx="2.5" fill="#FF4B32">
    <animate attributeName="width" values="118;178;118" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="1602" y="507" width="150" height="5" rx="2.5" fill="#FF4B32">
    <animate attributeName="x" values="1602;1560;1602" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- header -->
  <text x="72" y="88" fill="#17181A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.8">THEJUS PK / AI · ML · SYSTEMS</text>
  <text x="1728" y="88" text-anchor="end" fill="#73766F" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">PROFILE / 2026</text>

  <!-- identity -->
  <text x="72" y="274" fill="#151619" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="-4">THEJUS</text>
  <text x="72" y="354" fill="#151619" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="-4">PK<tspan fill="#FF4B32">.</tspan></text>

  <text x="72" y="442" fill="#151619" font-family="Georgia, 'Times New Roman', serif" font-size="18">Practical AI. Curious engineering.</text>
  <text x="72" y="468" fill="#73766F" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="1.25">AI &amp; DATA SCIENCE · KERALA · BUILDING USEFUL SOFTWARE</text>

  <!-- central statement -->
  <text x="486" y="208" fill="#FF4B32" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.4">I BUILD AI SYSTEMS</text>
  <text x="486" y="254" fill="#151619" font-family="Georgia, 'Times New Roman', serif" font-size="31">that turn machine-learning ideas</text>
  <text x="486" y="292" fill="#151619" font-family="Georgia, 'Times New Roman', serif" font-size="31">into useful software.</text>

  <text x="486" y="336" fill="#73766F" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.05">DOCUMENT AI · COMPUTER VISION · MACHINE LEARNING</text>
  <text x="486" y="358" fill="#73766F" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.05">LLM APPLICATIONS · AUTOMATION · INTELLIGENT SYSTEMS</text>

  <!-- restrained process line -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.3">
    <text x="486" y="424" fill="#FF4B32">01</text><text x="512" y="424" fill="#151619">BUILD</text>
    <text x="584" y="424" fill="#73766F">02</text><text x="610" y="424" fill="#151619">LEARN</text>
    <text x="680" y="424" fill="#73766F">03</text><text x="706" y="424" fill="#151619">ITERATE</text>
    <text x="792" y="424" fill="#73766F">04</text><text x="818" y="424" fill="#151619">SHIP</text>
  </g>

  <!-- minimal animated emblem -->
  <g transform="translate(1500 280)">
    <!-- gentle breathing of the complete mark -->
    <animateTransform attributeName="transform" type="translate" values="1500 280;1496 276;1503 283;1500 280" dur="10s" repeatCount="indefinite"/>

    <!-- diamond / crest outline -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-1.5;1.5;-1.5" dur="22s" repeatCount="indefinite"/>
      <rect x="-76" y="-76" width="152" height="152" fill="none" stroke="#17181A" stroke-width="1.7" transform="rotate(45)"/>
    </g>

    <!-- central accent -->
    <circle cx="0" cy="0" r="39" fill="#FF4B32">
      <animate attributeName="r" values="39;44;39" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.92;1;0.92" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- inner spark -->
    <circle cx="12" cy="-13" r="7" fill="#F4F1EA">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 -3;1 -5;-3 -2;0 0" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- tiny orbit marks -->
    <circle cx="-103" cy="0" r="3" fill="#FF4B32">
      <animate attributeName="cy" values="0;-9;0;9;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.45;1;0.35" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="103" cy="0" r="3" fill="#FF4B32">
      <animate attributeName="cy" values="0;9;0;-9;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1;0.45;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <path d="M-128 0H-108M108 0H128" fill="none" stroke="#17181A" stroke-width="1.7">
      <animate attributeName="d" values="M-128 0H-108M108 0H128;M-134 0H-108M108 0H134;M-128 0H-108M108 0H128" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- footer -->
  <text x="1728" y="472" text-anchor="end" fill="#73766F" font-family="monospace" font-size="9">THEJUSPK07 / BUILD · SHIP · LEARN</text>
</svg>