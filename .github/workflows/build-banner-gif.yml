name: Build banner GIF

on:
  push:
    paths:
      - "thejus_light_v2.svg"
      - "scripts/build_banner_gif.py"
      - ".github/workflows/build-banner-gif.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: pip install cairosvg pillow

      - name: Build GIF
        run: python scripts/build_banner_gif.py

      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thejus_light_motion.gif
          git diff --cached --quiet || git commit -m "Build fluid banner GIF"
          git push
